<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Zaplex">
  <!--
    Drawn as geometry, not <text>: the previous mark relied on system-ui, so
    the logo rendered in a different typeface on every device.
    Solid field, no gradient — a blue-to-green ramp muddies at favicon size
    and reads as two different brands at a glance.
  -->
  <rect width="512" height="512" rx="112" fill="#0f2c4d"/>
  <path
    d="M140 168 H372 L140 344 H372"
    fill="none"
    stroke="#ffffff"
    stroke-width="54"
    stroke-linecap="butt"
    stroke-linejoin="miter"
  />
</svg>
